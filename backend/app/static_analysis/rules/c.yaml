        rule_id: 9AUo6vE
        version_id: kbT3B1J
        url: https://semgrep.dev/playground/r/kbT3B1J/package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown
        origin: community
- id: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
