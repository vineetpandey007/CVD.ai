    - pattern-inside: '$JWT = require(''express-jwt'');

        ...

        '
    - pattern-inside: 'import $JWT from ''express-jwt'';

        ...

        '
    - pattern-inside: 'import * as $JWT from ''express-jwt'';

        ...

        '
    - pattern-inside: 'import { ..., $JWT, ... } from ''express-jwt'';

        ...

        '
  - pattern-either:
    - pattern: '$JWT({...,secret: "$Y",...},...)

        '
    - pattern: '$OPTS = "$Y";

